<!DOCTYPE html>
<html>
<head>
<title>WaKu-ctl - Current Status</title>
<link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon"> 
<script src="/all-jquery-deps.min.js"></script>
<meta charset="utf-8">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

  <div class="sidebar">
    <div class="card">
      <div class="logo-container">
        <img src="/logo.png" alt="WaKu-ctl Logo">
      </div>
      <h2>Menu</h2>
      <a href="/" class="active">Home</a>
      <a href="/fans">Fans & Temperatures</a>
      <a href="/rgb">ARGB Lighting</a>
      <a href="/settings">Settings</a>
    </div>
  </div>

  <div class="content">
    <div class="card">
      <h2>Current status</h2>

      <div class="data-section">
        <h3>Temperatures</h3>
        <div class="data-container" id="temps-container">
          <!-- Temperature data will be loaded here -->
        </div>
      </div>
      <div class="data-section">
        <h3>Fans</h3>
        <div class="data-container" id="fans-container">
          <!-- Fan data will be loaded here -->
        </div>
      </div>
    </div>
  </div>

  <script>
    function updateData() {
      $.ajax({
        url: '/get-data',
        type: 'GET',
        dataType: 'json',
        success: function(response) {
          const data = response.data;
          const units = response.units;
          const tempsContainer = $('#temps-container');
          const fansContainer = $('#fans-container');
          tempsContainer.empty();
          fansContainer.empty();

          // Process temperatures
          if (data.temps) {
            for (const key in data.temps) {
              if (data.temps.hasOwnProperty(key)) {
                const label = key.replace(/_/g, ' ');
                const value = data.temps[key];
                const displayValue = Math.abs(value) > 0 ? (Math.round((value + Number.EPSILON) * 100) / 100) : "N/A";
                // console.log(label + " --- " + value);
                if (displayValue != "N/A") {
                  tempsContainer.append(`
                    <div class="data-item">
                      <span class="data-label">${label}:</span>
                      <div class="data-value">${displayValue}°${units}</div>
                    </div>
                  `);
                }
              }
            }
          }

          // Process fans
          if (data.fans) {
            for (const key in data.fans) {
              if (data.fans.hasOwnProperty(key)) {
                const label = key.replace(/_/g, ' ');
                const value = data.fans[key];
                fansContainer.append(`
                  <div class="data-item">
                    <span class="data-label">${label} Speed:</span>
                    <div class="data-value">${value} RPM</div>
                  </div>
                `);
              }
            }
          }
        },
        error: function(error) {
          console.error('Error fetching data:', error);
          $('#data-container').html('<p>Error loading data. Please try again later.</p>');
        }
      });
    }

    // Update data initially and then every 5 seconds
    updateData();
    setInterval(updateData, 5000); 
  </script>
</body>
</html>
